<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reporte de Incidente · TMAZ</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Mismo sistema visual que la AST R-02: banda verde TMAZ, pasos numerados, tarjetas. */
:root{
  --bg:#F3F6F3; --surface:#FFFFFF; --subtle:#EAF1EB; --input:#F8FBF8;
  --border:#D5E0D7; --border-strong:#A9BEAE;
  --text:#14231A; --muted:#4E6356;
  --green:#0B4A2C; --green-2:#13663E; --green-tint:#E3EFE6;
  --red:#E3233F; --red-tint:#FCE6EA;
  --on-green:#FFFFFF; --focus:#E3233F;
  --ok:#178A53; --ok-bg:#E6F6EE; --warn:#9A6700; --warn-bg:#FFF4D6;
  --font-display:'Baloo 2','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r-s:8px; --r-m:14px;
  --shadow:0 1px 2px rgba(11,74,44,.08),0 2px 8px rgba(11,74,44,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1A12; --surface:#10261A; --subtle:#163222; --input:#0D2016; --border:#24412F; --border-strong:#3A5E47;
  --text:#EAF3EC; --muted:#A8BFB0; --green:#0E3B24; --green-2:#2E9E62; --green-tint:#183A27;
  --red:#FF5A70; --red-tint:#3A1720; --ok:#46C985; --ok-bg:#103523; --warn:#F2C94C; --warn-bg:#3A2F10;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1A12; --surface:#10261A; --subtle:#163222; --input:#0D2016; --border:#24412F; --border-strong:#3A5E47;
  --text:#EAF3EC; --muted:#A8BFB0; --green:#0E3B24; --green-2:#2E9E62; --green-tint:#183A27;
  --red:#FF5A70; --red-tint:#3A1720; --ok:#46C985; --ok-bg:#103523; --warn:#F2C94C; --warn-bg:#3A2F10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--green)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green);color:var(--on-green);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;height:48px}
.logo img{height:40px;width:auto;display:block}
.ttl{flex:1;min-width:200px}
.ttl h1{font-size:1.35rem;font-weight:800;color:var(--on-green)}
.ttl .code{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-weight:700}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:var(--on-green);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{background:rgba(255,255,255,.12)}

nav.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:18px 0 14px}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:var(--subtle);color:var(--green-2);border:1.5px solid var(--border-strong)}
.step .lbl{font-weight:800;font-size:.86rem;line-height:1.2;min-width:0}
.step .st{display:block;font-weight:600;font-size:.74rem;color:var(--muted)}
.step .short{display:none}
.step[aria-current="step"]{border-color:var(--green-2);box-shadow:inset 0 0 0 1px var(--green-2)}
.step[aria-current="step"] .n{background:var(--green-2);color:#fff;border-color:var(--green-2)}
.step.done .n{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
@media (min-width:961px){
  .layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start;padding-top:18px}
  .layout>footer{grid-column:1/-1}
  nav.steps{position:sticky;top:92px;grid-template-columns:minmax(0,1fr);gap:6px;margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:8px;box-shadow:var(--shadow)}
  nav.steps .step{border-color:transparent;background:transparent;padding:9px 10px}
  nav.steps .step:hover{background:var(--subtle)}
  nav.steps .step[aria-current="step"]{background:var(--green-tint);border-color:var(--green-2);box-shadow:none}
}
@media (max-width:960px) and (min-width:821px){.step .st{display:none}}
@media (max-width:820px){nav.steps{gap:5px}.step{flex-direction:column;padding:8px 3px;text-align:center;gap:4px}.step .lbl{font-size:.7rem}.step .full{display:none}.step .short{display:block}.step .st{display:none}}

main{padding-bottom:40px}
.panel{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.35rem;color:var(--green-2);margin-bottom:4px}
.card h3{font-size:1.05rem;color:var(--text)}
.sec{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.lead{color:var(--muted);margin:0 0 14px;max-width:76ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field label,.lab{font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.req::after{content:" *";color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=number],textarea,select{width:100%;background:var(--input);border:1.5px solid var(--border);border-radius:var(--r-s);padding:9px 11px;font-size:.95rem;min-width:0}
textarea{resize:vertical;min-height:44px;overflow:hidden}
input:focus,textarea:focus,select:focus{border-color:var(--green-2);outline:none;box-shadow:0 0 0 3px var(--green-tint)}
.hint{font-size:.82rem;color:var(--muted)}
.span2{grid-column:1/-1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;font-weight:800;font-size:.92rem;cursor:pointer;border:1.5px solid var(--green-2);background:var(--surface);color:var(--green-2)}
.btn:hover{background:var(--green-tint)}
.btn.primary{background:var(--green-2);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--green-2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 12px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:4px 9px;border-radius:8px;line-height:1}
.x:hover{background:var(--red-tint);color:var(--red)}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:800;font-size:.9rem;background:var(--input)}
.opt input{accent-color:var(--green-2);width:16px;height:16px;margin:0}
.opt:has(input:checked){border-color:var(--green-2);background:var(--green-tint);color:var(--green-2)}
.vq{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--input)}
.vq .q{font-weight:800}
.yn{display:inline-flex;border:1.5px solid var(--border-strong);border-radius:999px;overflow:hidden;flex:none}
.yn button{border:0;background:transparent;padding:6px 16px;font-weight:800;font-size:.86rem;cursor:pointer;color:var(--text)}
.yn button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--red);color:#fff}
.note{background:var(--warn-bg);color:var(--text);border-radius:var(--r-s);padding:10px 14px;font-size:.88rem}
.note b{color:var(--warn)}

/* fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ph{border:1.5px solid var(--border);border-radius:var(--r-m);overflow:hidden;background:var(--input);display:grid}
.ph .im{position:relative;background:#000;aspect-ratio:4/3}
.ph .im img{width:100%;height:100%;object-fit:contain;display:block}
.ph .im .no{position:absolute;top:8px;left:8px;background:var(--green-2);color:#fff;font-family:var(--font-display);font-weight:800;border-radius:8px;padding:0 9px}
.ph .im .x{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);color:#14231A}
.ph .bd{padding:10px;display:grid;gap:6px}
.ph .meta{font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ph .mv{border:0;background:none;color:var(--green-2);font-weight:800;cursor:pointer;padding:0 4px}
.drop{border:2px dashed var(--border-strong);border-radius:var(--r-m);padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--input)}
.drop.over{border-color:var(--green-2);background:var(--green-tint)}
.drop .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* firmas */
.decl{background:var(--green);color:#fff;border-radius:var(--r-m);padding:16px 18px;display:grid;gap:10px}
.decl p{margin:0;font-weight:700;line-height:1.5}
.decl small{opacity:.85;font-size:.78rem;line-height:1.4;display:block}
.auth{display:grid;gap:10px;align-content:start;border:1.5px solid var(--border);border-radius:var(--r-m);padding:14px;background:var(--input)}
.auth h3{color:var(--green-2)}
.sigbox{height:110px;border:1.5px dashed var(--border-strong);border-radius:var(--r-s);background:#fff;display:grid;place-items:center;cursor:pointer;padding:3px;color:#4E6356;font-weight:800;font-size:.9rem;width:100%}
.sigbox:hover{border-color:var(--green-2)}
.sigbox img{max-height:100px;max-width:100%;display:block}
.sigbox.signed{border-style:solid;border-color:var(--ok)}
.sigmeta{font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.sigmeta button{border:0;background:none;color:var(--red);font-weight:800;cursor:pointer;padding:0;font-size:.74rem}
.sigmeta .stale{color:var(--warn);font-weight:800}
dialog.sig{border:0;border-radius:var(--r-m);padding:0;width:min(720px,calc(100vw - 24px));background:var(--surface);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog.sig::backdrop{background:rgba(5,20,12,.6)}
.sig .sh{background:var(--green);color:#fff;padding:12px 16px;border-bottom:3px solid var(--red)}
.sig .sh h3{color:#fff;font-size:1.1rem}
.sig .sh p{margin:2px 0 0;font-size:.85rem;opacity:.9}
.sig .pad{margin:14px 16px 6px;position:relative;border:1.5px solid var(--border-strong);border-radius:var(--r-s);background:#fff;touch-action:none}
.sig canvas{display:block;width:100%;height:240px;touch-action:none;cursor:crosshair}
.sig .line{position:absolute;left:6%;right:6%;bottom:52px;border-top:1.5px solid #A9BEAE;pointer-events:none}
.sig .lineTxt{position:absolute;left:6%;bottom:30px;font-size:.75rem;color:#4E6356;pointer-events:none}
.sig .sa{display:flex;justify-content:space-between;gap:8px;padding:8px 16px 16px;flex-wrap:wrap}
@media (max-height:520px){.sig canvas{height:170px}}

/* resumen */
.status{border-radius:var(--r-m);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.status .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:900;flex:none}
.status h2{font-size:1.25rem}
.status p{margin:2px 0 0;font-size:.9rem}
.status.go{background:var(--ok-bg);border:1.5px solid var(--ok)} .status.go .ico{background:var(--ok);color:#fff} .status.go h2{color:var(--ok)}
.status.pend{background:var(--warn-bg);border:1.5px solid var(--warn)} .status.pend .ico{background:var(--warn);color:#fff} .status.pend h2{color:var(--warn)}
.check{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.check li{display:flex;gap:10px;align-items:flex-start}
.check .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900}
.check .ok{background:var(--ok-bg);color:var(--ok)}
.check .no{background:var(--warn-bg);color:var(--warn)}
.check a{color:var(--green-2);font-weight:800;cursor:pointer}
.exports{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.exp{border:1.5px solid var(--border);border-radius:var(--r-m);padding:16px;display:grid;gap:8px;align-content:start;background:var(--input)}
.exp h3{color:var(--green-2)}
.exp p{margin:0;color:var(--muted);font-size:.88rem}
.saved{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--input);font-size:.88rem}
.srow b{display:block}
.srow span{color:var(--muted);font-size:.78rem}
.srow.cur{border-color:var(--green-2);background:var(--green-tint)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.save-ind{font-size:.75rem;opacity:.85;font-weight:700}
footer{color:var(--muted);font-size:.78rem;padding-block:10px 30px;text-align:center}
@media (max-width:820px){header.top{position:static}.ttl h1{font-size:1.1rem}}
@media (max-width:620px){.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.panel{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><img id="logoImg" alt="tmaz Terminal Marítima Mazatlán"></div>
    <div class="ttl">
      <div class="code">TMAZ-SIG-SEG-R-08 · Versión 00 · <span id="folioInd"></span> <span id="saveInd" class="save-ind"></span></div>
      <h1>Reporte de Incidente</h1>
    </div>
    <div class="tools">
      <button class="chipbtn" id="newBtn" type="button">＋ Nuevo reporte</button>
      <button class="chipbtn" id="themeBtn" type="button"></button>
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav class="steps" id="steps" aria-label="Secciones"></nav>
  <main id="main"></main>
  <footer>Seguridad Industrial · TMAZ-SIG-SEG-R-08 · Lo capturado se guarda en este navegador; usa “Guardar respaldo” para pasarlo a otro equipo.</footer>
</div>
<div id="toast" hidden></div>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>
<input type="file" id="photoIn" accept="image/*" multiple hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>

<dialog class="sig" id="sigDlg" aria-labelledby="sigTitle">
  <div class="sh"><h3 id="sigTitle"></h3><p id="sigSub"></p></div>
  <div class="pad"><canvas id="sigCanvas"></canvas><div class="line"></div><div class="lineTxt">Firma sobre la línea</div></div>
  <div class="sa">
    <button class="btn ghost" id="sigClear" type="button">Borrar</button>
    <span style="display:flex;gap:8px"><button class="btn" id="sigCancel" type="button">Cancelar</button><button class="btn primary" id="sigSave" type="button">Guardar firma</button></span>
  </div>

const p2=n=>String(n).padStart(2,'0');
function today(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function nowT(){ const d=new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function newFolio(){ const d=new Date(); return `R08-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`; }
function blank(){ return {
  id:uid(), folio:newFolio(), created:Date.now(), updated:Date.now(), step:0,
  d:{testigo:'',cargo:'',supervisor:'',turno:'',antig:'',edad:'',lugar:'',contacto:'',empresa:'TMAZ',empresaNom:'',fInc:'',hInc:'',fEnt:today(),hEnt:nowT(),actividad:'',carga:[],cargaOtra:'',alcance:[],area:''},
  c:{puesto:'',habitual:'',motivo:''},
  x:{antes:'',hecho:'',consec:'',despues:''},
  e:{cond:[],otra:'',factores:'',prev:'',como:'',acciones:''},
  fotos:[],
  f:{testigo:{img:null,ts:0},entrevistador:{nombre:'',cargo:'',img:null,ts:0}}
}; }
function merge(base,o){ if(!o||typeof o!=='object') return base; for(const k in o){ if(!(k in base)){ base[k]=o[k]; continue; } if(Array.isArray(base[k])) base[k]=Array.isArray(o[k])?o[k]:base[k]; else if(base[k]&&typeof base[k]==='object') base[k]=merge(base[k],o[k]); else base[k]=o[k]; } return base; }
let S=blank();

/* ---------- almacenamiento: IndexedDB (aguanta fotos), con respaldo en localStorage ---------- */
let dbP=null;
function db(){ if(dbP) return dbP; dbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open(KEY,1); r.onupgradeneeded=()=>r.result.createObjectStore('rep',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbP; }
async function idb(mode,fn){ const d=await db(); return new Promise((res,rej)=>{ const tx=d.transaction('rep',mode); const st=tx.objectStore('rep'); const q=fn(st); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); }
const putRep=o=>idb('readwrite',s=>s.put(o));
const getRep=id=>idb('readonly',s=>s.get(id));
const allRep=()=>idb('readonly',s=>s.getAll());
const delRep=id=>idb('readwrite',s=>s.delete(id));
function setCur(id){ try{ localStorage.setItem(KEY+'-cur',id); }catch(e){} }
function getCur(){ try{ return localStorage.getItem(KEY+'-cur'); }catch(e){ return null; } }
let saveT;
function save(touch=true){ if(touch) S.updated=Date.now(); clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ await putRep(JSON.parse(JSON.stringify(S))); setCur(S.id); ind('· Guardado en este equipo'); }catch(e){ try{ localStorage.setItem(KEY+'-fallback',JSON.stringify(S)); setCur(S.id); ind('· Guardado'); }catch(e2){ ind('· No se pudo guardar: usa “Guardar respaldo”'); } } },300); }
function ind(t){ document.getElementById('saveInd').textContent=t; }

/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>v!=null&&String(v).trim()!=='';
function getP(p){ return p.split('.').reduce((o,k)=>o==null?o:o[k],S); }
function setP(p,v){ const ks=p.split('.'); let o=S; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]]=v; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,3200); }
function fmtDate(d){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); return m?`${m[3]}/${m[2]}/${m[1]}`:(d||''); }
function fmtTs(ts){ if(!ts) return ''; const d=new Date(ts); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
function b64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
const dataB64=d=>String(d).split(',')[1];
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);

/* ---------- tema ---------- */
function setTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); try{ t?localStorage.setItem(KEY+'-theme',t):localStorage.removeItem(KEY+'-theme'); }catch(e){} themeLabel(); }
function isDark(){ const a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; return matchMedia('(prefers-color-scheme: dark)').matches; }
function themeLabel(){ document.getElementById('themeBtn').textContent=isDark()?'☀ Claro':'● Oscuro'; }
document.getElementById('themeBtn').onclick=()=>setTheme(isDark()?'light':'dark');
try{ const t=localStorage.getItem(KEY+'-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

/* ---------- validación por sección ---------- */
function missing(i){
  const d=S.d,c=S.c,x=S.x,e=S.e,m=[];
  if(i===0){ if(!has(d.testigo)) m.push('Nombre del testigo entrevistado'); if(!has(d.lugar)) m.push('Lugar del incidente'); if(!has(d.fInc)) m.push('Fecha del incidente'); if(!has(d.hInc)) m.push('Hora del incidente'); if(!has(d.fEnt)) m.push('Fecha de entrevista'); if(!d.alcance.length) m.push('Alcance del incidente'); if(d.empresa==='EXTERNO'&&!has(d.empresaNom)) m.push('Nombre de la empresa externa'); }
  if(i===1){ if(!has(c.puesto)) m.push('Puesto / trabajo habitual'); if(!c.habitual) m.push('¿Correspondía a su trabajo habitual?'); if(c.habitual==='no'&&!has(c.motivo)) m.push('Motivo de no ser su actividad habitual'); }
  if(i===2){ if(!has(x.antes)) m.push('Actividad justo antes del incidente'); if(!has(x.hecho)) m.push('Descripción del hecho ocurrido'); if(!has(x.consec)) m.push('Consecuencia inmediata'); }
  if(i===3){ if(!e.prev) m.push('¿Pudo prevenirse?'); if(e.prev==='si'&&!has(e.como)) m.push('Cómo pudo prevenirse'); if(!has(e.acciones)) m.push('Acciones inmediatas'); if(e.cond.includes('Otra')&&!has(e.otra)) m.push('Especificar “Otra” condición'); }
  if(i===4){ /* fotos opcionales */ }
  if(i===5){ if(!S.f.testigo.img) m.push('Firma del testigo / entrevistado'); if(!has(S.f.entrevistador.nombre)) m.push('Nombre del entrevistador'); if(!S.f.entrevistador.img) m.push('Firma del entrevistador'); }
  return m;
}
const stepDone=i=>i===4?S.fotos.length>0:missing(i).length===0;

/* ---------- render ---------- */
function renderSteps(){
  document.getElementById('steps').innerHTML=STEPS.map((s,i)=>`<button class="step${stepDone(i)?' done':''}" data-go="${i}" ${S.step===i?'aria-current="step"':''}><span class="n">${stepDone(i)&&S.step!==i?'✓':i+1}</span><span class="lbl"><span class="full">${esc(s[0])}</span><span class="short">${esc(s[1])}</span><span class="st">${i===4?(S.fotos.length?S.fotos.length+' foto(s)':'Opcional'):(stepDone(i)?'Completo':'Sección '+s[2])}</span></span></button>`).join('');
}
function go(i){ S.step=Math.max(0,Math.min(5,i)); save(false); render(); window.scrollTo({top:0,behavior:'smooth'}); }
const navRow=i=>`<div class="navrow">${i>0?`<button class="btn" data-go="${i-1}">← Anterior</button>`:'<span></span>'}${i<5?`<button class="btn primary" data-go="${i+1}">Siguiente: ${esc(STEPS[i+1][0])} →</button>`:''}</div>`;
const fld=(lab,path,o={})=>{ const v=getP(path)??''; const id='f-'+path.replace(/\./g,'-'); const lst=o.list?` list="${id}-l"`:''; const dl=o.list?`<datalist id="${id}-l">${o.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''; const inp=o.area?`<textarea id="${id}" data-b="${path}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`:`<input type="${o.type||'text'}" id="${id}" data-b="${path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}"${lst}${o.type==='number'?' inputmode="numeric" min="0"':''}>`; return `<div class="field${o.span?' span2':''}"><label for="${id}"${o.req?' class="req"':''}>${esc(lab)}</label>${inp}${dl}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`; };
const multi=(path,opts)=>`<div class="opts">${opts.map(x=>`<label class="opt"><input type="checkbox" data-m="${path}" value="${esc(x)}" ${getP(path).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>`;
const yn=(q,path,o={})=>{ const v=getP(path); return `<div class="vq"><span class="q${o.req?' req':''}">${esc(q)}</span><span class="yn"><button type="button" class="y" data-yn="${path}" data-v="si" aria-pressed="${v==='si'}">Sí</button><button type="button" class="n" data-yn="${path}" data-v="no" aria-pressed="${v==='no'}">No</button></span></div>`; };
const head=(i,lead)=>`<div class="sec">Sección ${STEPS[i][2]}</div><h2>${esc(STEPS[i][0])}</h2><p class="lead">${lead}</p>`;

  <div class="grid2">
    ${fld('Nombre del testigo entrevistado','d.testigo',{req:1})}
    ${fld('Cargo','d.cargo')}
    ${fld('Supervisor','d.supervisor')}
    ${fld('Turno','d.turno',{list:TURNOS})}
  </div>
  <div class="grid4" style="margin-top:16px">
    ${fld('Antigüedad en el cargo','d.antig',{ph:'Ej. 2 años 3 meses'})}

    <div class="field" style="grid-column:span 2"><span class="lab">Empresa</span><div class="opts">${['TMAZ','EXTERNO'].map(x=>`<label class="opt"><input type="radio" name="emp" data-r="d.empresa" value="${x}" ${d.empresa===x?'checked':''}>${x==='TMAZ'?'TMAZ':'Externo'}</label>`).join('')}</div></div>

</div>

  <div class="grid4" style="margin-top:12px">

<div class="card"><h3>Actividad, carga y alcance</h3>

  </div>
</div>${navRow(0)}`; }

function vContexto(){ const c=S.c; return `<div class="card">${head(1,'Puesto habitual de la persona y si la actividad correspondía a su trabajo.')}
  <div style="display:grid;gap:14px">
    ${fld('Puesto / trabajo habitual','c.puesto',{req:1,list:PUESTOS,ph:'Maniobrista, operador, mecánico, soldador, chofer, supervisor…'})}
    ${yn('¿La actividad realizada correspondía a su trabajo habitual?','c.habitual',{req:1})}

  <div style="display:grid;gap:16px">
    ${fld('Actividad que realizaba justo antes del incidente','x.antes',{area:1,req:1})}

function vEntorno(){ const e=S.e; return `<div class="card"><div class="sec">Sección IV</div><h2>Condiciones del entorno</h2><p class="lead">Marca las condiciones que el testigo considera que estuvieron presentes al momento del incidente.</p>

    ${fld('Acciones realizadas inmediatamente después del incidente','e.acciones',{area:1,rows:3,req:1,ph:'Detener actividades, notificar al supervisor, primeros auxilios, aislar el área, trasladar lesionado(s)…'})}
  </div>
</div>${navRow(3)}`; }

function vFotos(){ const f=S.fotos; return `<div class="card"><div class="sec">Anexo fotográfico</div><h2>Fotos del incidente</h2><p class="lead">Agrega fotos del lugar, equipo, daños o condiciones. Se incluyen al final del PDF, dos por hoja, con su descripción. Se reducen automáticamente para no ocupar mucho espacio.</p>
  <div class="drop" id="drop">

    <span class="hint">${f.length} foto(s) agregada(s)</span>
  </div>
  ${f.length?`<div class="photos" style="margin-top:16px">${f.map((p,i)=>`<div class="ph"><div class="im"><img src="${p.img}" alt="Foto ${i+1}"><span class="no">${i+1}</span><button class="x" data-delf="${i}" title="Quitar foto" aria-label="Quitar foto ${i+1}">×</button></div><div class="bd"><textarea data-cap="${i}" rows="2" placeholder="Descripción de la foto (qué se ve, dónde)">${esc(p.cap)}</textarea><div class="meta"><span>${esc(fmtTs(p.ts))}</span><span>${i>0?`<button class="mv" data-mv="${i}" data-d="-1" aria-label="Mover antes">◀</button>`:''}${i<f.length-1?`<button class="mv" data-mv="${i}" data-d="1" aria-label="Mover después">▶</button>`:''}</span></div></div></div>`).join('')}</div>`:''}
</div>${navRow(4)}`; }

function sigSlot(key,who){ const s=key==='t'?S.f.testigo:S.f.entrevistador; const stale=s.img&&S.updated>s.ts+1500; return `<div class="sigbox${s.img?' signed':''}" data-sig="${key}" role="button" tabindex="0">${s.img?`<img src="${s.img}" alt="Firma de ${esc(who)}">`:'✍ Toca para firmar'}</div>
  <div class="sigmeta">${s.img?`<span>Firmado ${esc(fmtTs(s.ts))}</span>${stale?'<span class="stale">⚠ El reporte cambió después de firmar</span>':''}<button data-unsig="${key}">Borrar firma</button>`:'<span>Sin firma</span>'}</div>`; }

function vFirmas(){ const d=S.d, en=S.f.entrevistador; const all=[0,1,2,3,5].map(i=>({i,m:missing(i)})); const pend=all.filter(a=>a.m.length); const ok=!pend.length;
  return `<div class="card"><div class="sec">Sección VI</div><h2>Declaración del testigo entrevistado</h2>

  <small>${esc(LEGAL)}</small></div>
</div>

  <div class="grid2">

    <div class="auth"><h3>Entrevistador</h3>${fld('Nombre del entrevistador','f.entrevistador.nombre',{req:1})}${fld('Cargo','f.entrevistador.cargo',{ph:'Ej. Coordinador de Seguridad Industrial'})}${sigSlot('e','entrevistador')}</div>
  </div>
</div>
<div class="status ${ok?'go':'pend'}"><span class="ico">${ok?'✓':'!'}</span><div><h2>${ok?'Reporte completo':'Faltan datos'}</h2><p>${ok?'Ya puedes descargar el PDF del registro.':'Puedes descargar el PDF, pero saldrá con campos vacíos.'}</p></div></div>
${pend.length?`<div class="card"><h3>Pendientes</h3><ul class="check" style="margin-top:10px">${pend.map(a=>a.m.map(t=>`<li><span class="dot no">!</span><span>${esc(t)} · <a data-go="${a.i}">${esc(STEPS[a.i][0])}</a></span></li>`).join('')).join('')}</ul></div>`:''}
<div class="card"><h3>Descargar y respaldar</h3>
  <div class="exports" style="margin-top:12px">
    <div class="exp"><h3>PDF del registro</h3><p>Formato R-08 con firmas y anexo fotográfico (${S.fotos.length} foto${S.fotos.length===1?'':'s'}). Listo para imprimir o subir a SharePoint.</p><button class="btn primary" id="pdfBtn">⬇ Descargar PDF</button></div>
    <div class="exp"><h3>Respaldo</h3><p>Archivo .json con todo el reporte, firmas y fotos, para abrirlo en otro equipo.</p><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bakBtn">Guardar respaldo</button><button class="btn ghost" id="openBtn">Abrir respaldo</button></span></div>
  </div>
</div>
<div class="card"><h3>Reportes en este equipo</h3><p class="hint" style="margin:4px 0 10px">Se guardan en el navegador de este dispositivo.</p><div class="saved" id="savedList"><span class="hint">Cargando…</span></div></div>
${navRow(5)}`; }

const LEGAL='“La simulación de un incidente de trabajo puede ser sancionada y da lugar al cobro de las prestaciones indebidamente obtenidas; lo anterior conforme a lo establecido al efecto por el Artículo 1006 de la LFT y Artículo 488 LFT quedando excento de las obligaciones al patrón, el que dispone que “Incurrirán en las penas establecidas en el artículo 386 del Código Penal Federal, los que hicieren declaraciones falsas en certificados de supervivencia, de estado civil y demás que se exigen para el otorgamiento de beneficios de previsión.”';

const VIEWS=[vDatos,vContexto,vDesc,vEntorno,vFotos,vFirmas];
function render(){
  document.getElementById('folioInd').textContent='Folio '+S.folio;
  renderSteps();
  const m=document.getElementById('main'); m.innerHTML=`<div class="panel">${VIEWS[S.step]()}</div>`;
  m.querySelectorAll('textarea').forEach(grow);
  if(S.step===5) renderSaved();
  if(S.step===4) wireDrop();
}
function grow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+3)+'px'; }

/* ---------- eventos ---------- */
const main=document.getElementById('main');
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(+g.dataset.go); } });
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.b){ setP(t.dataset.b,t.value); save(); if(t.tagName==='TEXTAREA') grow(t); if(t.dataset.b==='d.testigo'||t.dataset.b==='f.entrevistador.nombre') renderSteps(); else renderStepsSoon(); }
  if(t.dataset.cap!=null){ S.fotos[+t.dataset.cap].cap=t.value; save(); grow(t); }
});
let rsT; function renderStepsSoon(){ clearTimeout(rsT); rsT=setTimeout(renderSteps,250); }
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.m){ const arr=getP(t.dataset.m); const i=arr.indexOf(t.value); if(t.checked&&i<0) arr.push(t.value); if(!t.checked&&i>=0) arr.splice(i,1); save(); if(t.value==='Otra') render(); else renderSteps(); }
  if(t.dataset.r){ setP(t.dataset.r,t.value); save(); render(); }
});
main.addEventListener('click',async e=>{
  const y=e.target.closest('[data-yn]'); if(y){ const cur=getP(y.dataset.yn); setP(y.dataset.yn,cur===y.dataset.v?'':y.dataset.v); save(); render(); return; }
  const sg=e.target.closest('[data-sig]'); if(sg){ openSig(sg.dataset.sig); return; }
  const us=e.target.closest('[data-unsig]'); if(us){ const o=us.dataset.unsig==='t'?S.f.testigo:S.f.entrevistador; o.img=null; o.ts=0; save(false); render(); return; }
  const df=e.target.closest('[data-delf]'); if(df){ if(confirm('¿Quitar esta foto?')){ S.fotos.splice(+df.dataset.delf,1); save(); render(); } return; }
  const mv=e.target.closest('[data-mv]'); if(mv){ const i=+mv.dataset.mv, j=i+(+mv.dataset.d); [S.fotos[i],S.fotos[j]]=[S.fotos[j],S.fotos[i]]; save(); render(); return; }
  if(e.target.id==='camBtn') document.getElementById('camIn').click();
  if(e.target.id==='galBtn') document.getElementById('photoIn').click();
  if(e.target.id==='pdfBtn'){ const b=e.target; b.disabled=true; b.textContent='Generando…'; try{ const bytes=await exportPdf(); downloadBlob(new Blob([bytes],{type:'application/pdf'}),`${FORM.code}_${S.folio}${S.d.testigo?'_'+slug(S.d.testigo):''}.pdf`); toast('PDF descargado'); }catch(err){ console.error(err); toast('No se pudo generar el PDF: '+err.message); } b.disabled=false; b.textContent='⬇ Descargar PDF'; }
  if(e.target.id==='bakBtn'){ downloadBlob(new Blob([JSON.stringify({form:FORM.code,v:1,data:S})],{type:'application/json'}),`${FORM.code}_${S.folio}_respaldo.json`); toast('Respaldo descargado'); }
  if(e.target.id==='openBtn') document.getElementById('jsonIn').click();
  const op=e.target.closest('[data-open]'); if(op){ await flush(); const r=await getRep(op.dataset.open); if(r){ S=merge(blank(),r); setCur(S.id); render(); toast('Reporte '+S.folio+' abierto'); } return; }
  const dl=e.target.closest('[data-del]'); if(dl){ if(confirm('¿Borrar este reporte de este equipo? No se puede deshacer.')){ await delRep(dl.dataset.del); renderSaved(); toast('Reporte borrado'); } return; }

async function flush(){ clearTimeout(saveT); try{ await putRep(JSON.parse(JSON.stringify(S))); }catch(e){} }
document.getElementById('newBtn').onclick=async()=>{ if(!confirm('¿Iniciar un reporte nuevo? El actual queda guardado en este equipo.')) return; await flush(); S=blank(); save(); render(); toast('Reporte nuevo '+S.folio); };

async function renderSaved(){ const el=document.getElementById('savedList'); if(!el) return; let list=[]; try{ list=await allRep(); }catch(e){ el.innerHTML='<span class="hint">No disponible en este navegador.</span>'; return; }
  if(!list.some(r=>r.id===S.id)) list.push(S);
  list.sort((a,b)=>b.updated-a.updated);
  el.innerHTML=list.map(r=>`<div class="srow${r.id===S.id?' cur':''}"><div><b>${esc(r.folio)} · ${esc(r.d&&r.d.testigo||'Sin nombre')}</b><span>${esc(r.d&&r.d.lugar||'Sin lugar')} · Incidente ${esc(fmtDate(r.d&&r.d.fInc)||'sin fecha')} · Editado ${esc(fmtTs(r.updated))}</span></div>${r.id===S.id?'<span class="hint" style="font-weight:800">Abierto</span>':`<button class="btn sm" data-open="${esc(r.id)}">Abrir</button>`}${r.id===S.id?'<span></span>':`<button class="x" data-del="${esc(r.id)}" title="Borrar" aria-label="Borrar reporte">×</button>`}</div>`).join(''); }

document.getElementById('jsonIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const o=JSON.parse(await f.text()); const data=o.data||o; if(!data.d||!data.x) throw new Error('no es un respaldo del R-08'); await flush(); S=merge(blank(),data); if(!S.id) S.id=uid(); save(false); render(); toast('Respaldo '+S.folio+' abierto'); }catch(err){ toast('No se pudo abrir: '+err.message); } };

/* ---------- fotos ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>rej(new Error('formato no compatible')); im.src=u; }); }
async function addPhotos(files){ files=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)); if(!files.length) return; let ok=0,bad=0; toast('Procesando '+files.length+' foto(s)…');
  for(const f of files){ try{ const im=await loadImg(f); const max=1600, k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k); const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h); S.fotos.push({id:uid(),img:c.toDataURL('image/jpeg',0.8),cap:'',ts:f.lastModified||Date.now(),w,h}); ok++; }catch(err){ bad++; } }
  save(); render(); toast(`${ok} foto(s) agregada(s)`+(bad?` · ${bad} no se pudieron leer (si son HEIC, cámbialas a JPG)`:'')); }
document.getElementById('photoIn').onchange=e=>{ addPhotos(e.target.files); e.target.value=''; };
document.getElementById('camIn').onchange=e=>{ addPhotos(e.target.files); e.target.value=''; };
function wireDrop(){ const d=document.getElementById('drop'); if(!d) return; ['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{ e.preventDefault(); d.classList.add('over'); })); ['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{ e.preventDefault(); d.classList.remove('over'); })); d.addEventListener('drop',e=>addPhotos(e.dataTransfer.files)); }

/* ---------- firma ---------- */
const dlg=document.getElementById('sigDlg'), cv=document.getElementById('sigCanvas');
let g,drawing=false,last=null,inked=false,sigTarget=null;
function openSig(k){
  sigTarget=k;
  if(k==='t'){ document.getElementById('sigTitle').textContent='Firma del testigo / entrevistado'; document.getElementById('sigSub').textContent=S.d.testigo||'Escribe el nombre del testigo en Datos generales'; }
  else { document.getElementById('sigTitle').textContent='Firma del entrevistador'; document.getElementById('sigSub').textContent=S.f.entrevistador.nombre||'Escribe el nombre del entrevistador'; }
  if(typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
  requestAnimationFrame(setupCanvas);
}
function setupCanvas(){ const dpr=Math.max(1,window.devicePixelRatio||1), r=cv.getBoundingClientRect(); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); g=cv.getContext('2d',{willReadFrequently:true}); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,r.width,r.height); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#0B1F3A'; g.lineWidth=2.6; inked=false; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; last=pt(e); g.beginPath(); g.arc(last.x,last.y,1.3,0,Math.PI*2); g.fillStyle='#0B1F3A'; g.fill(); inked=true; });
cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs){ const p=pt(ev); g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke(); last=p; } inked=true; });
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ drawing=false; }));
document.getElementById('sigClear').onclick=setupCanvas;
document.getElementById('sigCancel').onclick=()=>dlg.close();
document.getElementById('sigSave').onclick=()=>{
  if(!inked){ toast('Dibuja la firma antes de guardar.'); return; }
  // recortar al trazo
  const w=cv.width,h=cv.height, data=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ if(data[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } }
  const pad=12; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w,x1+pad); y1=Math.min(h,y1+pad);
  const out=document.createElement('canvas'); out.width=Math.max(1,x1-x0); out.height=Math.max(1,y1-y0); out.getContext('2d').drawImage(cv,x0,y0,out.width,out.height,0,0,out.width,out.height);
  const o=sigTarget==='t'?S.f.testigo:S.f.entrevistador; S.updated=Date.now(); o.img=out.toDataURL('image/png'); o.ts=S.updated;
  dlg.close(); save(false); render(); toast('Firma guardada');
};

const pdfSafe=s=>String(s??'').replace(/\r/g,'').replace(/\t/g,' ').split('').map(ch=>{ const c=ch.charCodeAt(0); if(ch==='\n'||(c>=32&&c<=126)||(c>=160&&c<=255)||WIN.has(ch)) return ch; if(ch==='≥') return '>='; if(ch==='≤') return '<='; return ''; }).join('');

async function exportPdf(){

  const text=(s,x,yy,o={})=>{ const f=o.font||(o.bold?fB:fR), sz=o.size||8.5; const tx=pdfSafe(s); let xx=x; if(o.align==='center') xx=x+(o.w-f.widthOfTextAtSize(tx,sz))/2; if(o.align==='right') xx=x+o.w-f.widthOfTextAtSize(tx,sz); page.drawText(tx,{x:xx,y:yy,size:sz,font:f,color:o.color||C.t}); };
  const rect=(x,yy,w,h,o={})=>page.drawRectangle({x,y:yy,width:w,height:h,color:o.fill,borderColor:o.border,borderWidth:o.border?(o.bw||0.7):0});
  const hline=(x,yy,w,o={})=>page.drawLine({start:{x,y:yy},end:{x:x+w,y:yy},thickness:o.t||0.8,color:o.color||C.ln});
  const header=()=>{
    page=doc.addPage([W,H]); pages.push(page);
    const top=H-M, hh=66, lw=100, rw=96, mw=CW-lw-rw;
    rect(M,top-hh,CW,hh,{border:C.ln,bw:1});
    page.drawLine({start:{x:M+lw,y:top},end:{x:M+lw,y:top-hh},thickness:1,color:C.ln});

  const row=(cells,o={})=>{ const sz=o.size||8.5, lh=sz*1.25, pad=3.5; const tw=cells.reduce((a,c)=>a+c.lw+c.vw,0), k=CW/tw;

    opts.forEach((op,i)=>{ const lbl=op+(op==='Otra'&&extra&&sel.includes('Otra')?': '+extra:''); const tw=fR.widthOfTextAtSize(pdfSafe(lbl),7.6)+18; const ww=Math.max(per,tw); if(used+ww>lineW&&used>0){ cx=x+4; used=0; cy-=12; } box(cx,cy,sel.includes(op)); text(lbl,cx+11,cy+1,{size:7.6}); cx+=ww; used+=ww; }); };

  { const sz=7.8; ensure(20); text('MARQUE LAS CONDICIONES QUE CONSIDERE ESTUVIERON PRESENTES AL MOMENTO DEL INCIDENTE:',M+4,y-11,{bold:true,size:7}); y-=16;
    const cols=3, cw=CW/cols; const items=COND.map(k=>k==='Otra'?'Otra (especifique)'+(e.cond.includes('Otra')&&has(e.otra)?': '+e.otra:''):k);
    for(let i=0;i<items.length;i+=cols){ const ls=items.slice(i,i+cols).map(t=>wrap(t.toUpperCase(),fR,sz,cw-22)); const h=Math.max(...ls.map(l=>l.length))*9.5+5; ensure(h); ls.forEach((l,j)=>{ const bx=M+4+j*cw; box(bx,y-11,e.cond.includes(COND[i+j])); l.forEach((ln,q)=>text(ln,bx+13,y-10-q*9.5,{size:sz})); }); y-=h; }
    y-=2; hline(M,y,CW,{t:0.6}); }
  block('DESDE SU PERCEPCIÓN, INDIQUE QUÉ FACTORES CONSIDERA QUE INFLUYERON EN EL INCIDENTE.',e.factores,{lines:3});

  section('V. MEDIDAS PREVENTIVAS Y ACCIONES INMEDIATAS');
  row([{l:'¿CONSIDERA QUE EL INCIDENTE PUDO PREVENIRSE?',lw:4.2,vw:3.8,box:(bx,by,bw,bh)=>{ const cy=by-bh/2-3.5; box(bx+14,cy,e.prev==='si'); text('SÍ',bx+25,cy+1,{size:8}); box(bx+90,cy,e.prev==='no'); text('NO',bx+101,cy+1,{size:8}); }}],{min:16});
  block('EN CASO AFIRMATIVO, INDIQUE CÓMO:',e.prev==='si'?e.como:'',{lines:2,lw:CW*0.4});
  block('INDIQUE LAS ACCIONES REALIZADAS INMEDIATAMENTE DESPUÉS DEL INCIDENTE (EJ. DETENER LAS ACTIVIDADES, NOTIFICAR AL SUPERVISOR, APLICAR PRIMEROS AUXILIOS, AISLAR EL ÁREA, TRASLADAR A LESIONADO(S), ETC.):',e.acciones,{lines:3,lw:CW});

  // VI + VII juntas en la misma hoja
  { const decl=`YO, ${has(d.testigo)?d.testigo.toUpperCase():'______________________________________________'}, DECLARO QUE LA INFORMACIÓN PROPORCIONADA EN EL PRESENTE REPORTE ES VERAZ Y CORRESPONDE A LOS HECHOS OCURRIDOS CONFORME A MI CONOCIMIENTO. ESTOY CONSCIENTE DE QUE LA SIMULACIÓN O DECLARACIÓN FALSA DE UN INCIDENTE PUEDE DERIVAR EN LAS SANCIONES APLICABLES CONFORME A LA LEGISLACIÓN VIGENTE.`;
    const DL=wrap(decl,fB,8,CW-16), LG=wrap(LEGAL,fI,6.8,CW-8); const need=15+DL.length*10.5+12+LG.length*8.4+10+15+150; ensure(need);
    section('VI. DECLARACIÓN: NOMBRE Y FIRMA DEL TESTIGO ENTREVISTADO');
    y-=6; DL.forEach(ln=>{ text(ln,M+8,y-8,{bold:true,size:8}); y-=10.5; }); y-=6;
    LG.forEach(ln=>{ text(ln,M+4,y-7,{font:fI,size:6.8,color:C.m}); y-=8.4; }); y-=8;
    section('VII. FIRMAS');
    const bw=(CW-30)/2, bh=96; y-=8;
    const sig=async(bx,o,name,role,cargo)=>{ if(o.img){ const im=await doc.embedPng(b64ToBytes(dataB64(o.img))); const s=im.scaleToFit(bw-20,bh-26); page.drawImage(im,{x:bx+(bw-s.width)/2,y:y-bh+22+(bh-26-s.height)/2,width:s.width,height:s.height}); }
      hline(bx,y-bh+20,bw,{t:0.9,color:C.t}); text(pdfSafe(name||' ').toUpperCase(),bx,y-bh+10,{bold:true,size:8,align:'center',w:bw}); text(role+(cargo?' · '+cargo:''),bx,y-bh+1,{size:7,align:'center',w:bw,color:C.m}); if(o.img) text('Firmado: '+fmtTs(o.ts),bx,y-bh-8,{size:6.3,align:'center',w:bw,color:C.m}); };
    await sig(M,S.f.testigo,d.testigo,'Nombre y firma del testigo / entrevistado',d.cargo);
    await sig(M+bw+30,S.f.entrevistador,S.f.entrevistador.nombre,'Nombre y firma del entrevistador',S.f.entrevistador.cargo);
    y-=bh+14; }

  // anexo fotográfico: 2 por hoja
  if(S.fotos.length){
    const per=2, boxH=(H-2*M-66-18-30-18)/per-34;
    for(let i=0;i<S.fotos.length;i++){
      if(i%per===0){ header(); section(`ANEXO FOTOGRÁFICO (${S.fotos.length} FOTO${S.fotos.length>1?'S':''})`); y-=8; }
      const p=S.fotos[i]; const im=await doc.embedJpg(b64ToBytes(dataB64(p.img))); const s=im.scaleToFit(CW-12,boxH-6);
      rect(M,y-boxH,CW,boxH,{fill:C.sub,border:C.b}); page.drawImage(im,{x:M+(CW-s.width)/2,y:y-boxH+(boxH-s.height)/2,width:s.width,height:s.height});
      rect(M+6,y-20,30,15,{fill:C.g2}); text(String(i+1),M+6,y-16,{bold:true,size:9,color:C.w,align:'center',w:30});
      y-=boxH+4; const CL=wrap(`Foto ${i+1}: `+(has(p.cap)?p.cap:'Sin descripción'),fR,8.2,CW-10).slice(0,2); CL.forEach(ln=>{ text(ln,M+4,y-8,{size:8.2}); y-=10.5; }); y=y-(2-CL.length)*10.5-10;
    }
  }
  const n=pages.length, gen=fmtTs(Date.now());
  pages.forEach((pg,i)=>{ page=pg; hline(M,M+10,CW,{t:0.5,color:C.b}); text(`${FORM.code} · Versión ${FORM.ver} · Folio ${S.folio} · Generado ${gen}`,M,M,{size:6.8,color:C.m}); text(`Página ${i+1} de ${n}`,M,M,{size:6.8,color:C.m,align:'right',w:CW}); });
  return doc.save();
}

  catch(e){ try{ const r=localStorage.getItem(KEY+'-fallback'); if(r) S=merge(blank(),JSON.parse(r)); }catch(e2){} }

window.__r08={get S(){return S;},set S(v){S=v;},render,exportPdf,save};
